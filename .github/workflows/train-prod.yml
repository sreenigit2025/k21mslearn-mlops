name: Train model in prod (PR comment)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  train-prod:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/train-prod')
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list --query "[?starts_with(name,'rg-ai300-l')].name | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi

          WS_NAME=$(az ml workspace list --resource-group "$RG_NAME" --query "[?starts_with(name,'mlw-ai300-l')].name | [0]" -o tsv)
          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in prod and capture logs
        id: train
        run: |
          JOB_NAME="diabetes-train-prod-${{ github.run_id }}"
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "Running Azure ML job in prod: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-prod-folder@latest \
            --stream | tee training_output.log

      - name: Extract prod metrics from logs
        id: parse-metrics
        env:
          JOB_NAME: ${{ steps.train.outputs.job_name }}
        run: |
          # Log streaming (--stream) can fail with a storage AuthenticationFailed
          # error, leaving training_output.log without the script output. Download
          # the job's std_log.txt after completion and parse that instead.
          # The stream can end while the job is still Finalizing, and download is
          # only allowed once it reaches a terminal state, so wait (up to 10 min).
          for i in $(seq 1 60); do
            STATUS=$(az ml job show --name "$JOB_NAME" --query status -o tsv 2>/dev/null) || true
            case "$STATUS" in Completed|Failed|Canceled|NotResponding|Paused) break ;; esac
            echo "Job status: ${STATUS:-unknown}; waiting..."
            sleep 10
          done
          echo "Job status: $STATUS"

          az ml job download --name "$JOB_NAME" --all --download-path job_output >/dev/null || true
          LOG_FILES=$(find job_output -name 'std_log*.txt' 2>/dev/null) || true
          [ -f training_output.log ] && LOG_FILES="$LOG_FILES training_output.log"

          ACC=$(cat $LOG_FILES 2>/dev/null | grep -oE "^Accuracy:? [0-9.]+" | tail -n 1 | awk '{print $2}') || true
          AUC=$(cat $LOG_FILES 2>/dev/null | grep -oE "^AUC:? [0-9.]+" | tail -n 1 | awk '{print $2}') || true
          STUDIO_URL=$(az ml job show --name "$JOB_NAME" --query services.Studio.endpoint -o tsv 2>/dev/null) || true

          echo "Prod accuracy: $ACC"
          echo "Prod AUC: $AUC"

          echo "prod_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "prod_auc=$AUC" >> "$GITHUB_OUTPUT"
          echo "studio_url=$STUDIO_URL" >> "$GITHUB_OUTPUT"

      - name: Comment prod metrics on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.prod_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.prod_auc }}';
            const jobName = '${{ steps.train.outputs.job_name }}';
            const studioUrl = '${{ steps.parse-metrics.outputs.studio_url }}';

            const prNumber = context.issue.number;

            let body = '✅ Prod training workflow completed.';
            body += '\n\n**Azure ML job**';
            body += `\n- Name: ${jobName}`;
            if (studioUrl) body += `\n- Studio: ${studioUrl}`;
            if (acc || auc) {
              body += '\n\n**Prod evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be parsed from logs. Check the Azure Machine Learning job run for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
